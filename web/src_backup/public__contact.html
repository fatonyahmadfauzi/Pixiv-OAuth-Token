<body class="download-showcase-body">

        </button>
      </div>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
  </header>

  <main class="download-showcase-main">
    <section class="download-showcase-hero">
      <h1 data-i18n="contactUsTitle">Contact Us</h1>
      <p data-i18n="contactUsDesc">Have questions, suggestions, or need help? Send us a message.</p>
    </section>

    <div class="contact-form-container">
      <div id="contactSuccess" class="gh-discussions-notice"
        style="display: none; justify-content: center; text-align: center; border-color: #3fb950;">
        <div style="display: grid; gap: 10px; justify-items: center;">
          <i class="bi bi-check-circle-fill" style="font-size: 2.5rem; color: #3fb950;"></i>
          <h3 class="gh-discussions-title" style="margin: 0;" data-i18n="contactSuccessTitle">Message Sent Successfully!
          </h3>
          <p class="gh-discussions-desc" style="margin: 0;" data-i18n="contactSuccessDesc">Thank you for contacting us.
            We will get back to you shortly.</p>
        </div>
      </div>

      <form id="contactForm" action="https://formsubmit.co/fatonyahmadfauzi@gmail.com" method="POST"
        enctype="multipart/form-data" class="gh-issue-card" style="display: grid; gap: 20px;">
        <input type="hidden" name="_subject" value="New Contact Message from Pixiv OAuth Web">
        <input type="hidden" name="_next" value="https://pixiv-o-auth-token.vercel.app/contact?success=true">
        <input type="hidden" name="_captcha" value="true">
        <input type="hidden" name="_template" value="box">

        <div class="form-row">
          <div class="form-group">
            <label for="firstName" style="display: flex; flex-direction: column; gap: 8px;">
              <span data-i18n="contactFirstName" style="margin-bottom: 2px;">First Name <span class="required">*</span></span>
              <input type="text" id="firstName" name="First Name" class="gh-input" required placeholder="John" autocomplete="given-name">
            </label>
          </div>
          <div class="form-group">
            <label for="lastName" style="display: flex; flex-direction: column; gap: 8px;">
              <span data-i18n="contactLastName" style="margin-bottom: 2px;">Last Name <span class="required">*</span></span>
              <input type="text" id="lastName" name="Last Name" class="gh-input" required placeholder="Doe" autocomplete="family-name">
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="email" style="display: flex; flex-direction: column; gap: 8px;">
            <span data-i18n="contactEmail" style="margin-bottom: 2px;">Email Address <span class="required">*</span></span>
            <input type="email" id="email" name="Email" class="gh-input" required placeholder="john.doe@example.com"
              data-i18n-placeholder="contactPlaceholderEmail" autocomplete="email">
          </label>
        </div>

        <div class="form-group">
          <label for="attachment" data-i18n="contactAttachment">Attachment (Optional)</label>
          <div class="custom-file-wrapper">
            <input type="file" id="attachment" name="attachment" class="gh-file-input"
              accept="image/*,.pdf,.zip,.log,.txt" style="display: none;">
            <button type="button" id="customFileBtn" class="btn gh-btn"><i class="bi bi-paperclip"></i> <span
                data-i18n="contactChooseFile">Choose file</span></button>
            <span id="customFileText" class="custom-file-text" data-i18n="contactNoFile">No file chosen</span>
          </div>
          <small class="form-hint" data-i18n="contactFileLimit">Max file size according to email limits.</small>
        </div>

        <div class="form-group">
          <label for="message" style="display: flex; flex-direction: column; gap: 8px;">
            <span data-i18n="contactMessage" style="margin-bottom: 2px;">Message <span class="required">*</span></span>
            <textarea id="message" name="Message" class="gh-input" rows="6" required placeholder="How can we help you?"
              data-i18n-placeholder="contactPlaceholderMessage"></textarea>
          </label>
        </div>

        <button type="submit" class="btn primary gh-new-issue-btn" style="margin-top: 10px;">
          <i class="bi bi-send" aria-hidden="true"></i> <span data-i18n="contactSendBtn">Send Message</span>
        </button>
      </form>
    </div>
  </main>
