<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Pixiv OAuth Web jumbotron preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060b18"/>
      <stop offset="55%" stop-color="#152244"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="420" cy="300" r="320" fill="#6ea2ff" opacity="0.15"/>
  <circle cx="920" cy="120" r="180" fill="#4a89ff" opacity="0.1"/>

  <text x="72" y="96" fill="#8eb8ff" font-size="28" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" letter-spacing="3">PIXIV OAUTH TOOLKIT</text>
  <text x="72" y="205" fill="#e6eeff" font-size="78" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800">Pixiv OAuth Web</text>
  <text x="72" y="270" fill="#c7d6f9" font-size="36" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="600">Professional Token Helper</text>

  <text x="72" y="355" fill="#a9bbdf" font-size="32" font-family="Inter,Segoe UI,Arial,sans-serif">Generate and refresh Pixiv OAuth tokens with a modern UI,</text>
