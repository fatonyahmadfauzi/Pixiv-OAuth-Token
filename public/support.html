<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#0b0d12">
  <title>Pixiv OAuth – Support / Donate</title>
  <link rel="canonical" href="https://pixiv-o-auth-token.vercel.app/support">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="shortcut icon" href="/assets/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css">
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    .support-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      max-width: 500px;
      margin: 0 auto 4rem auto;
      text-align: center;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }
    
    .support-card:hover {
      border-color: rgba(0, 150, 250, 0.3);
      box-shadow: 0 15px 40px rgba(0, 150, 250, 0.1);
      transform: translateY(-2px);
    }

    .support-qris-wrap {
      background: white;
      padding: 1rem;
      border-radius: var(--radius-md);
      display: inline-block;
      margin: 1.5rem 0;
    }

    .support-qris-img {
      max-width: 100%;
      height: auto;
      display: block;
      border-radius: 4px;
    }

    .support-instruction {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 1rem;
    }
    
    .support-icon {
      font-size: 2.5rem;
      color: var(--accent);
      margin-bottom: 1rem;
    }
  </style>
</head>
<body class="download-showcase-body">
  <header class="tutorial-docs-header">
    <div class="tutorial-docs-inner">
      <div class="tutorial-docs-top">
        <a class="tutorial-docs-brand" href="/"><strong>Pixiv OAuth</strong><span data-i18n="footerDonateLink">SUPPORT</span></a>
        <nav class="tutorial-docs-actions" aria-label="Page actions">
          <div class="sidebar-header">
            <a class="sidebar-brand" href="/"><strong>Pixiv OAuth</strong></a>
            <button class="close-sidebar" aria-label="Close menu"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
          </div>
          <a href="/" id="navHomepageLabel">Homepage</a>
          <a href="/#console" id="navConsole">Console</a>
          <a href="/downloads" id="navDownloads">Download</a>
          <a href="/tutorial" id="navTutorial">Tutorial</a>
        </nav>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
          <i class="bi bi-list" aria-hidden="true"></i>
        </button>
      </div>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
  </header>

  <main class="download-showcase-main">
    <section class="download-showcase-hero">
      <h1 data-i18n="supportPageTitle">Support / Donate</h1>
      <p data-i18n="supportPageDescHtml">Thank you for supporting this project! Scan the QRIS code below to donate.</p>
    </section>

    <div class="support-card">
      <div class="support-icon">
        <i class="bi bi-heart-fill"></i>
      </div>
      <div class="support-qris-wrap">
        <img src="/assets/qris.png" alt="QRIS Code" class="support-qris-img" width="350">
      </div>
      <p class="support-instruction">
        <i class="bi bi-qr-code-scan"></i> <span data-i18n="supportScanInstruction">Scan with your supported e-wallet or banking app.</span>
      </p>
    </div>

  </main>

  <footer class="tutorial-docs-footer site-footer" id="mainFooter"></footer>
  <script src="/components/footer.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
