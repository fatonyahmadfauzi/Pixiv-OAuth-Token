<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#0b0d12">
  <title>Pixiv OAuth – Contact</title>
  <link rel="canonical" href="https://pixiv-o-auth-token.vercel.app/contact">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="shortcut icon" href="/assets/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="download-showcase-body">
  <header class="tutorial-docs-header">
    <div class="tutorial-docs-inner">
      <div class="tutorial-docs-top">
        <a class="tutorial-docs-brand" href="/"><strong>Pixiv OAuth</strong><span data-i18n="navHeaderContact">CONTACT</span></a>
        <nav class="tutorial-docs-actions" aria-label="Page actions">
          <div class="sidebar-header">
            <a class="sidebar-brand" href="/"><strong>Pixiv OAuth</strong></a>
            <button class="close-sidebar" aria-label="Close menu"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
          </div>
          <a href="/" id="navHomepageLabel">Homepage</a>
          <a href="/#console" id="navConsole">Console</a>
          <a href="/downloads" id="navDownloads">Download</a>
          <a href="/tutorial" id="navTutorial">Tutorial</a>
        </nav>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
          <i class="bi bi-list" aria-hidden="true"></i>
        </button>
      </div>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
  </header>

  <main class="download-showcase-main">
    <section class="download-showcase-hero">
      <h1 data-i18n="contactUsTitle">Contact Us</h1>
      <p data-i18n="contactUsDesc">Have questions, suggestions, or need help? Send us a message.</p>
    </section>

    <div class="contact-form-container">
      <div id="contactSuccess" class="gh-discussions-notice" style="display: none; justify-content: center; text-align: center; border-color: #3fb950;">
        <div style="display: grid; gap: 10px; justify-items: center;">
          <i class="bi bi-check-circle-fill" style="font-size: 2.5rem; color: #3fb950;"></i>
          <h3 class="gh-discussions-title" style="margin: 0;" data-i18n="contactSuccessTitle">Message Sent Successfully!</h3>
          <p class="gh-discussions-desc" style="margin: 0;" data-i18n="contactSuccessDesc">Thank you for contacting us. We will get back to you shortly.</p>
        </div>
      </div>

      <form id="contactForm" action="https://formsubmit.co/fatonyahmadfauzi@gmail.com" method="POST" enctype="multipart/form-data" class="gh-issue-card" style="display: grid; gap: 20px;">
        <input type="hidden" name="_subject" value="New Contact Message from Pixiv OAuth Web">
        <input type="hidden" name="_next" value="https://pixiv-o-auth-token.vercel.app/contact?success=true">
        <input type="hidden" name="_captcha" value="true">
        <input type="hidden" name="_template" value="box">

        <div class="form-row">
          <div class="form-group">
            <label for="firstName" data-i18n="contactFirstName">First Name <span class="required">*</span></label>
            <input type="text" id="firstName" name="First Name" class="gh-input" required placeholder="John">
          </div>
          <div class="form-group">
            <label for="lastName" data-i18n="contactLastName">Last Name <span class="required">*</span></label>
            <input type="text" id="lastName" name="Last Name" class="gh-input" required placeholder="Doe">
          </div>
        </div>

        <div class="form-group">
          <label for="email" data-i18n="contactEmail">Email Address <span class="required">*</span></label>
          <input type="email" id="email" name="Email" class="gh-input" required placeholder="john.doe@example.com" data-i18n-placeholder="contactPlaceholderEmail">
        </div>

        <div class="form-group">
          <label for="attachment" data-i18n="contactAttachment">Attachment (Optional)</label>
          <div class="custom-file-wrapper">
            <input type="file" id="attachment" name="attachment" class="gh-file-input" accept="image/*,.pdf,.zip,.log,.txt" style="display: none;">
            <button type="button" id="customFileBtn" class="btn gh-btn"><i class="bi bi-paperclip"></i> <span data-i18n="contactChooseFile">Choose file</span></button>
            <span id="customFileText" class="custom-file-text" data-i18n="contactNoFile">No file chosen</span>
          </div>
          <small class="form-hint" data-i18n="contactFileLimit">Max file size according to email limits.</small>
        </div>

        <div class="form-group">
          <label for="message" data-i18n="contactMessage">Message <span class="required">*</span></label>
          <textarea id="message" name="Message" class="gh-input" rows="6" required placeholder="How can we help you?" data-i18n-placeholder="contactPlaceholderMessage"></textarea>
        </div>

        <button type="submit" class="btn primary gh-new-issue-btn" style="margin-top: 10px;">
          <i class="bi bi-send" aria-hidden="true"></i> <span data-i18n="contactSendBtn">Send Message</span>
        </button>
      </form>
    </div>
  </main>

  <footer class="tutorial-docs-footer site-footer" id="mainFooter"></footer>
  <script src="/components/footer.js"></script>

  <script src="/assets/app.js"></script>
  <script src="/assets/contact.js"></script>
</body>
</html>
