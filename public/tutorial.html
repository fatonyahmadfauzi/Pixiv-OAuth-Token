<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#6ea2ff">
  <title>Pixiv OAuth Tutorial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">Pixiv OAuth</a>
      <nav class="nav-links">
        <a href="/">Home</a>
      </nav>
    </div>
  </header>

  <main class="container tutorial-page">
    <section class="card tutorial-hero">
      <p class="kicker">Step by Step Guide</p>
      <h1>Tutorial Pixiv OAuth</h1>
      <p class="muted">Ikuti langkah berikut untuk login sampai exchange token. Halaman ini dipisah agar lebih fokus, clean, dan nyaman di semua device.</p>
    </section>

    <section id="tutorial" class="card tutorial standalone-tutorial">
      <h2>Tutorial</h2>
      <p class="muted">Urutan screenshot dari login sampai token berhasil didapatkan.</p>
      <div class="tutorial-grid">
        <figure class="tutorial-item"><figcaption>1. Open Login Page</figcaption><img src="https://cdn.jsdelivr.net/gh/fatonyahmadfauzi/Pixiv-OAuth-Token@master/tutorial_images/step_1.png" alt="Step 1" onerror="const figure=this.parentElement; this.replaceWith(document.createTextNode('Add tutorial_images/01-open-login-page.png')); if (figure) figure.classList.add('missing')"></figure>
        <figure class="tutorial-item"><figcaption>2. Continue Login</figcaption><img src="https://cdn.jsdelivr.net/gh/fatonyahmadfauzi/Pixiv-OAuth-Token@master/tutorial_images/02-continue-login.png" alt="Step 2" onerror="const figure=this.parentElement; this.replaceWith(document.createTextNode('Add tutorial_images/02-continue-login.png')); if (figure) figure.classList.add('missing')"></figure>
        <figure class="tutorial-item"><figcaption>3. Open Console</figcaption><img src="https://cdn.jsdelivr.net/gh/fatonyahmadfauzi/Pixiv-OAuth-Token@master/tutorial_images/03-open-console.png" alt="Step 3" onerror="const figure=this.parentElement; this.replaceWith(document.createTextNode('Add tutorial_images/03-open-console.png')); if (figure) figure.classList.add('missing')"></figure>
        <figure class="tutorial-item"><figcaption>4. Copy pixiv URL</figcaption><img src="https://cdn.jsdelivr.net/gh/fatonyahmadfauzi/Pixiv-OAuth-Token@master/tutorial_images/04-copy-pixiv-url.png" alt="Step 4" onerror="const figure=this.parentElement; this.replaceWith(document.createTextNode('Add tutorial_images/04-copy-pixiv-url.png')); if (figure) figure.classList.add('missing')"></figure>
        <figure class="tutorial-item"><figcaption>5. Paste URL / Code</figcaption><img src="https://cdn.jsdelivr.net/gh/fatonyahmadfauzi/Pixiv-OAuth-Token@master/tutorial_images/step_5.png" alt="Step 5" onerror="const figure=this.parentElement; this.replaceWith(document.createTextNode('Add tutorial_images/05-paste-url-code.png')); if (figure) figure.classList.add('missing')"></figure>
        <figure class="tutorial-item"><figcaption>6. Exchange Token</figcaption><img src="https://cdn.jsdelivr.net/gh/fatonyahmadfauzi/Pixiv-OAuth-Token@master/tutorial_images/result.png" alt="Step 6" onerror="const figure=this.parentElement; this.replaceWith(document.createTextNode('Add tutorial_images/06-exchange-token.png')); if (figure) figure.classList.add('missing')"></figure>
      </div>
    </section>
  </main>
</body>
</html>
